# Blueprint Render - TOUT en plan GRATUIT. Dashboard Render > New > Blueprint > choisir le depot GitHub.
# NON valide contre le schema de Render depuis mon environnement : Render signale toute erreur a l'import du Blueprint.
services:
  - type: web
    name: baobab-api
    runtime: docker            # utilise le Dockerfile du depot
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt          # region la plus proche de l'Afrique parmi celles de Render (a confirmer)
    healthCheckPath: /health/
    autoDeploy: false          # le deploiement est declenche par GitHub Actions (apres tests + migrations)
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SERVICE_ROLE      # API REST ET WebSocket dans UN SEUL service (750 h gratuites/mois = un seul service 24h/24)
        value: api
      - key: WEB_CONCURRENCY   # un seul worker : memoire limitee de l'offre gratuite
        value: "1"
      - key: ENABLE_IN_PROCESS_SCHEDULER   # remplace le cron (payant sur Render)
        value: "true"
      - key: LOG_JSON
        value: "true"
      - key: MONGODB_DATABASE
        value: baobab
      # ---- VALEURS PROPRES A VOTRE INSTALLATION : volontairement ABSENTES de ce fichier (sync: false) ----
      # Render ne les ecrase jamais lors d'un deploiement. A saisir UNE FOIS dans Render > Environment :
      #   DJANGO_ALLOWED_HOSTS    = baobab-router.pages.dev                (sans https://)
      #   CSRF_TRUSTED_ORIGINS    = https://baobab-router.pages.dev
      #   CORS_ALLOWED_ORIGINS    = https://baobab-router.pages.dev
      - { key: DJANGO_ALLOWED_HOSTS, sync: false }
      - { key: CSRF_TRUSTED_ORIGINS, sync: false }
      - { key: CORS_ALLOWED_ORIGINS, sync: false }
      # Redis EXTERNE gratuit (Upstash) : cache, verrous, compteurs, idempotence. Le WebSocket utilise la memoire du processus
      # (CHANNEL_REDIS_URL volontairement absente) : une seule instance, un seul worker.
      # Secrets : a saisir dans le dashboard Render (jamais dans ce fichier)
      # ---- PHASE DE TEST : a PASSER A "false" AVANT LA PRODUCTION (voir A_NE_PAS_OUBLIER.md) ----
      - { key: OTP_DEBUG_ECHO, value: "true" }                 # renvoie le code OTP dans la reponse de l'API
      - { key: PAYMENTS_SIMULATION_ENABLED, value: "true" }    # active POST /payments/{id}/simulate/
      - { key: STORAGE_BACKEND, value: "fake" }                # "s3" des qu'un bucket est configure
      - { key: STORAGE_FAKE_AUTO_COMPLETE, value: "true" }     # accepte la fin d'envoi sans verifier le bucket
      # ---- Reglages permanents ----
      - { key: OTP_EMAIL_DAILY_LIMIT, value: "25" }
      - { key: JWT_ACCESS_LIFETIME_MINUTES, value: "120" }     # confortable pour les tests ; 15 en production
      - { key: DJANGO_SECRET_KEY, sync: false }
      - { key: DATABASE_URL, sync: false }
      - { key: MONGODB_URL, sync: false }
      - { key: REDIS_URL, sync: false }
      - { key: FIELD_ENCRYPTION_KEY, sync: false }
      - { key: INTERNAL_JOB_SECRET, sync: false }
      - { key: CRON_JOB_TOKEN, sync: false }          # jeton du cron externe (cron-job.org), >= 24 caracteres
      - { key: EDGE_SHARED_SECRET, sync: false }
